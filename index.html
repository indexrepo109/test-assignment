<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Developer Test</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Transaction Dashboard</h1>
    <p class="intro">Review recent customer transactions.</p>

    <section class="panel" aria-label="Transactions">
      <div class="controls">
        <label>Search
          <input id="searchInput" type="search" placeholder="Customer or transaction ID">
        </label>
        <label>Status
          <select id="statusFilter">
            <option value="all">All</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
            <option value="failed">Failed</option>
          </select>
        </label>
      </div>

      <p id="summary" aria-live="polite">0 transactions</p>
      <div class="table-container">
        <table>
          <thead><tr><th>ID</th><th>Customer</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="transactionRows"></tbody>
        </table>
      </div>
      <p id="emptyState" hidden>No transactions match your search.</p>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
